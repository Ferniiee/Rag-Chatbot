<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Chatbot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 16px 24px; border-bottom: 1px solid #2a2a2a; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; font-weight: 600; color: #fff; }
  .badge { background: #1a1a2e; color: #7b7ff5; font-size: 11px; padding: 2px 8px; border-radius: 20px; border: 1px solid #3a3a6e; }
  .main { display: flex; flex: 1; overflow: hidden; }
  .sidebar { width: 280px; border-right: 1px solid #2a2a2a; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .sidebar h2 { font-size: 13px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
  .upload-zone { border: 2px dashed #333; border-radius: 10px; padding: 24px 16px; text-align: center; cursor: pointer; transition: border-color 0.2s; }
  .upload-zone:hover { border-color: #7b7ff5; }
  .upload-zone input { display: none; }
  .upload-zone p { font-size: 13px; color: #666; margin-top: 8px; }
  .upload-btn { background: #7b7ff5; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; width: 100%; font-weight: 500; }
  .upload-btn:hover { background: #6366d1; }
  .doc-list { display: flex; flex-direction: column; gap: 6px; }
  .doc-item { background: #1a1a1a; border-radius: 6px; padding: 8px 12px; font-size: 12px; color: #aaa; border: 1px solid #2a2a2a; display: flex; align-items: center; gap: 8px; }
  .doc-item::before { content: "📄"; font-size: 14px; }
  .chat-area { flex: 1; display: flex; flex-direction: column; }
  .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 75%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
  .msg.user { background: #7b7ff5; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.bot { background: #1a1a1a; color: #e0e0e0; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #2a2a2a; }
  .msg.bot .sources { margin-top: 8px; font-size: 11px; color: #666; border-top: 1px solid #2a2a2a; padding-top: 6px; }
  .msg.bot .sources span { color: #7b7ff5; }
  .input-bar { padding: 16px 24px; border-top: 1px solid #2a2a2a; display: flex; gap: 10px; }
  .input-bar input { flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 12px 16px; color: #e0e0e0; font-size: 14px; outline: none; }
  .input-bar input:focus { border-color: #7b7ff5; }
  .input-bar button { background: #7b7ff5; color: #fff; border: none; border-radius: 8px; padding: 12px 20px; cursor: pointer; font-size: 14px; font-weight: 500; }
  .input-bar button:hover { background: #6366d1; }
  .status { font-size: 12px; color: #666; padding: 0 24px 8px; }
  .typing { color: #7b7ff5; font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>RAG Chatbot</h1>
  <span class="badge">Powered by Groq + ChromaDB</span>
</header>
<div class="main">
  <div class="sidebar">
    <div>
      <h2>Documents</h2>
    </div>
    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
      <div style="font-size:28px">📁</div>
      <p>Click to upload a PDF or TXT file</p>
      <input type="file" id="fileInput" accept=".pdf,.txt,.md" onchange="uploadFile(this)">
    </div>
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">Upload Document</button>
    <div>
      <h2 style="margin-bottom:10px">Loaded files</h2>
      <div class="doc-list" id="docList">
        <div style="font-size:12px;color:#555">No documents loaded yet</div>
      </div>
    </div>
  </div>
  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="msg bot">
        👋 Upload a document on the left, then ask me anything about it. I'll answer using only what's in your files.
        <div class="sources">Tip: try uploading your resume, a research paper, or any PDF</div>
      </div>
    </div>
    <div class="status" id="status"></div>
    <div class="input-bar">
      <input type="text" id="questionInput" placeholder="Ask a question about your documents..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>
<script>
  const docs = [];

  async function uploadFile(input) {
    const file = input.files[0];
    if (!file) return;
    setStatus(`Uploading ${file.name}...`);
    const formData = new FormData();
    formData.append("file", file);
    try {
      const res = await fetch("/upload", { method: "POST", body: formData });
      const data = await res.json();
      if (data.error) { setStatus("Error: " + data.error); return; }
      docs.push(data.filename);
      updateDocList();
      setStatus(data.message);
      addMessage("bot", `✅ Loaded **${data.filename}**. You can now ask questions about it.`);
    } catch (e) {
      setStatus("Upload failed. Is the server running?");
    }
    input.value = "";
  }

  async function sendMessage() {
    const input = document.getElementById("questionInput");
    const question = input.value.trim();
    if (!question) return;
    addMessage("user", question);
    input.value = "";
    setStatus("Thinking...", true);
    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
      });
      const data = await res.json();
      addMessage("bot", data.answer, data.sources);
      setStatus("");
    } catch (e) {
      addMessage("bot", "Something went wrong. Is the server running?");
      setStatus("");
    }
  }

  function addMessage(role, text, sources = []) {
    const messages = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.innerHTML = text.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
    if (sources.length) {
      const s = document.createElement("div");
      s.className = "sources";
      s.innerHTML = "Sources: " + sources.map(s => `<span>${s}</span>`).join(", ");
      div.appendChild(s);
    }
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function updateDocList() {
    const list = document.getElementById("docList");
    list.innerHTML = docs.map(d => `<div class="doc-item">${d}</div>`).join("");
  }

  function setStatus(msg, typing = false) {
    const s = document.getElementById("status");
    s.textContent = msg;
    s.className = typing ? "status typing" : "status";
  }
</script>
</body>
</html>
